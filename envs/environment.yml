# Conda/mamba equivalent of the core environment in ../pyproject.toml.
# Use this on clusters where conda is the norm; otherwise `uv sync` from the
# repo root is the reference path (it is the one pinned by uv.lock).
#
#   mamba env create -f envs/environment.yml
#   mamba activate ukbgym-sumstats
#
# The `annotation` extra (pyBigWig, pyfaidx, pysam, biopython) is included here
# because those packages build more reliably from conda-forge/bioconda than
# from PyPI. Hail is deliberately absent — see requirements-hail.txt.
name: ukbgym-sumstats
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - polars>=1.33
  - pyarrow>=15
  - pandas>=2.2,<3
  - numpy>=1.26
  - scipy>=1.13
  - scikit-learn>=1.5
  - statsmodels>=0.14
  - matplotlib-base>=3.9
  - plotnine>=0.13
  - tqdm>=4.66
  - pyyaml>=6.0
  - ipykernel>=6.29
  - jupyterlab>=4.2
  # annotation extra — not needed to reproduce figures from the master table
  - pybigwig>=0.3.22
  - pyfaidx>=0.8
  - pysam>=0.22
  - biopython>=1.83
  - duckdb>=1.0
  - requests>=2.32
  - pip
  - pip:
      # not on conda-forge
      - colormaps>=0.4
