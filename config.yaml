anngeno_file: PATH_TO_FILE
maf: 0.001

covariates:
  - age
  - age2
  - age_sex
  - sex
  - genetic_pc_1
  - genetic_pc_2
  - genetic_pc_3
  - genetic_pc_4
  - genetic_pc_5
  - genetic_pc_6
  - genetic_pc_7
  - genetic_pc_8
  - genetic_pc_9
  - genetic_pc_10
  - genetic_pc_11
  - genetic_pc_12
  - genetic_pc_13
  - genetic_pc_14
  - genetic_pc_15
  - genetic_pc_16
  - genetic_pc_17
  - genetic_pc_18
  - genetic_pc_19
  - genetic_pc_20

rare_variant_annotations:
  genetic_diversity:
    cadd_raw:
      color: "#1f77b4"
      label: "CADD Raw"

  missense:
    am_pathogenicity: 
      color: "#e76e5b"
      label: "AlphaMissense"
    esmscoremissense: 
      color: "#feb72d"
      label: "ESM1v"
      direction: -1

  conservation:
    gpn_score: 
      color: "#942c80"
      label: "GPN-MSA"
      direction: -1
    zooverphylop: 
      color: "#6a1c81"
      label: "Zoonomia vertebrate\nPhyloP"
    verphylop: 
      color: "#440154"
      label: "Vertebrate PhyloP"

  naive:
    relprotpos:
      color: "#90d743"
      label: "Relative Protein\nPosition"
    relative_cds_position:
      color: "#b5de2b"
      label: "Relative CDS\nPosition"


