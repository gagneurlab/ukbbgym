# Additional settings if using the REGENIE integration
regenie_options:
  regenie_exp: True
  gtf_file: PATH_TO_FILE
  pred_list: PATH_TO_FILE
  step_1:
      bgen: PATH_TO_FILE
      snplist: PATH_TO_FILE
      bsize: 1000
      options:
          - "--sample PATH_TO_FILE"
          - "--qt"
  step_2:
      bsize: 400
      options:
          - "--qt"
      #TODO has to be adapted for disease traits

phenotype_prediction:
  cv_sample_file_dir: PATH_TO_FILE
  prs_pheno_map_file: PATH_TO_FILE
  prs_file: PATH_TO_FILE
  min_n_genes: 5
  standardize_prs: True
  alpha: 0.05
  correction_type: "FDR"