rare_variant_annotations:
  plof:
    # --- Highest Confidence LoF (Deep Red) ---
    loftee_hc:
      color: "#990000"  # Darkest Red (Highest confidence/most critical)
      label: "LOFTEE HC"

    # --- Standard LoF (Mid-Red Shades) ---
    consequence_stop_gained:
      color: "#CC0000"  # Standard Red
      label: "Stop Gained"
    consequence_splice_acceptor_variant:
      color: "#FF3333"  # Lighter Red
      label: "Splice Acceptor"
    consequence_splice_donor_variant:
      color: "#FF6666"  # Even Lighter Red
      label: "Splice Donor"
      
    # --- Less Certain LoF (Pink/Soft Red) ---
    consequence_stop_lost:
      color: "#FF9999"  # Pinkish Red
      label: "Stop Lost"
    consequence_start_lost:
      color: "#FFCCCC"  # Very Light Red/Pink
      label: "Start Lost"

  missense:
    consequence_missense_variant:
      color: "#FF9933" # Amber/Dark Orange (Clear separation from Red LoF)
      label: "VEP Missense"

  indel_categories:
    # --- Frameshift (Primary Indel Severity) ---
    consequence_frameshift_variant:
      color: "#00A99D"  # Dark Green (Kept original, signifies severity within indels)
      label: "VEP Frameshift"

    deletion:
      color: "#2E8B57" # Sea Green (A moderate, general green)
      label: "Deletion"
    insertion:
      color: "#1E90FF" # Dodger Blue (A vibrant, general blue)
      label: "Insertion"
    
  indel_length:
    # --- Deletions (Light Green to Dark Green) ---
    short_deletion:
      color: "#90EE90"  # Light Green (Lightest)
      label: "1bp Deletion"
    medium_deletion:
      color: "#3CB371"  # Medium Sea Green (Medium)
      label: "2-3bp Deletion"
    long_deletion:
      color: "#006400"  # Dark Green (Darkest)
      label: ">3bp Deletion"
    # --- Insertions (Light Blue to Dark Blue) ---
    short_insertion:
      color: "#ADD8E6"  # Light Blue (Lightest)
      label: "1bp Insertion"
    medium_insertion:
      color: "#4682B4"  # Steel Blue (Medium)
      label: "2-3bp Insertion"
    long_insertion:
      color: "#191970"  # Midnight Blue (Darkest)
      label: ">3bp Insertion"

  5utr_annotator:
    # --- 5' UTR Frameshift (Distinct Cyan/Teal) ---
    five_prime_utr_variant_consequence_uframeshift:
      color: "#00A99D" # Teal (Kept original, but now distinct from all other indels)
      label: "5UTR Frameshift"
    # --- 5' UTR Gained Events (Bright Yellow/Gold) ---
    five_prime_utr_variant_consequence_uaug_gained:
      color: "#FFD700"  # Gold (AUG Start Gained)
      label: "5UTR Start Gain"
    five_prime_utr_variant_consequence_ustop_gained:
      color: "#FFA500"  # Orange (uSTOP Gained)
      label: "5UTR Stop Gain"
    # --- 5' UTR Lost Events (Duller Yellow/Orange) ---
    five_prime_utr_variant_consequence_uaug_lost:
      color: "#DAA520"  # Goldenrod (AUG Start Lost)
      label: "5UTR Start Lost"
    five_prime_utr_variant_consequence_ustop_lost:
      color: "#B8860B"  # Dark Goldenrod (uSTOP Lost)
      label: "5UTR Stop Lost"
  
  encode_boolean:
    not_in_encode:
      color: "black"
      label: "Not annotated in ENCODE\nannotated region"
    encode_annotated:
      color: "peru"
      label: "Variant in ENCODE\nannotated region"
  
  encode_enhancer:
    # --- Promoter/Enhancer Spectrum ---
    encode_pls:
      color: "#E41A1C"  # Red (Standard for Active Promoters)
      label: "Promoter-Like Signature"
    encode_pels:
      color: "#FF8C00"
      label: "Proximal Enhancer-Like Signature"
    encode_dels:
      color: "#FFD700"
      label: "Distal Enhancer-Like Signature"
    # --- Structural/Basal Marks ---
    encode_ca_ctcf:
      color: "#4DAF4A"  # Green (Standard for CTCF/Insulator elements)
      label: "Accessible Region with CTCF Binding"
    encode_ca:
      color: "#377EB8"  # Medium Blue (For Chromatin Accessible Only)
      label: "Chromatin Accessible"
    encode_ca_tf:
      color: "#1D6498"
      label: "Accessible Region with TF Binding"
    # --- Factor/Histone-Specific Marks ---
    encode_ca_h3k4me3:
      color: "#A65628"  # Brown (Promoter-like mark, distinct from PLS)
      label: "Accessible Region with Promoter Mark"
    encode_tf:
      color: "#984EA3"  # Purple (For Transcription Factor Binding)
      label: "Transcription Factor Binding Only"
    